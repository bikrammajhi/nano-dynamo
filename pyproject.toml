[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-dynamo"
version = "1.0.0"
description = "KV-aware routing proxy for disaggregated LLM inference, structured as a readable map of NVIDIA Dynamo's architecture"
requires-python = ">=3.10"

dependencies = [
    "xxhash",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "transformers",
]

[project.optional-dependencies]
bench = ["aiperf", "modal"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
