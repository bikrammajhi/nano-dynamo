[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-prefix-router"
version = "0.1.0"
description = "Educational HTTP proxy demonstrating prefix-aware LLM request routing via radix tree and cost function"
requires-python = ">=3.10"

dependencies = [
    "xxhash",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "transformers",
    "pyzmq",
    "pydantic>=2.0",
    "sse-starlette>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
