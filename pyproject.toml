[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-dynamo"
version = "0.1.0"
description = "Minimal reimplementation of NVIDIA Dynamo's KV-aware routing core"
requires-python = ">=3.10"

dependencies = [
    "xxhash",
    "vllm>=0.7.2",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "sse-starlette>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
