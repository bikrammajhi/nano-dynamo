[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-dynamo"
version = "1.0.0"
description = "KV-aware routing proxy for disaggregated LLM inference, structured as a readable map of NVIDIA Dynamo's architecture"
requires-python = ">=3.10"

dependencies = [
    # Pinned: NIXL/vLLM-adjacent APIs drift fast; these are the versions the
    # suite (9/9) and GPU proofs (10/10) actually ran against.
    "xxhash==4.0.1",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "transformers==5.17.0",
]

[project.optional-dependencies]
bench = ["aiperf", "modal"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
